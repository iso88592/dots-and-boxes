<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Dots and Boxes</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}"/>
    <style>
        .game-row {
            display: block;
            padding:0;
            margin:0;
        }
        .game-cell {
            text-align: center;
            padding:0;
            margin:0;
            display:inline-block;
            width: 40px;
            height: 40px;
            border: 1px solid gray;
            background-color: lightgray;
        }
        .game-cell.border-l0 {
            border-left: 1px solid red;
        }
        .game-cell.border-l1 {
            border-left: 1px solid green;
        }
        .game-cell.border-t0 {
            border-top: 1px solid red;
        }
        .game-cell.border-t1 {
            border-top: 1px solid green;
        }
        .game-cell.border-r0 {
            border-right: 1px solid red;
        }
        .game-cell.border-r1 {
            border-right: 1px solid green;
        }
        .game-cell.border-b0 {
            border-bottom: 1px solid red;
        }
        .game-cell.border-b1 {
            border-bottom: 1px solid green;
        }
        .game-cell.fill-0 {
            background-color: red;
            color: white;
        }
        .game-cell.fill-1 {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
<main class="container">
    <div class="row">
        <section class="col-12">
            <h1 class="text-center">Dots and Boxes</h1>
        </section>
        <section class="col-9" id="game-state">
            <h2>Game state</h2>
            <div id="gifs">
                <div >
                    <img th:each="gif : ${gifs}" th:src="@{'/gifs/' + ${gif}}" th:alt="${gif}">
                </div>
            </div>
        </section>
        <section class="col-3" id="participants">
            <h2>Participants</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Names</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${clients.size() == 0}">
                        <td colspan="3" class="text-center">There are no participants yet.</td>
                    </tr>
                    <tr th:if="${clients.size() > 0}" th:each="client: ${clients}">
                        <td th:text="${client.getId() + ' ' + client.getPublicAddress()}"></td>
                        <td th:text="${client.getNames()}"></td>
                        <td th:text="${client.getScore()}"></td>
                    </tr>
                </tbody>
            </table>
            Wanna join? Click <a id="join" class="" th:href="@{/join}">here!</a>

        </section>
    </div>
</main>
<script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.min.js}"></script>
<script>
    async function updateClientList() {
        const response = await fetch('/');
        const data = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(data, 'text/html');
        const participants = document.getElementById('participants');
        if (participants.innerHTML !== doc.getElementById('participants').innerHTML)
            participants.innerHTML = doc.getElementById('participants').innerHTML;
        const gifs = document.getElementById('gifs');
        if (gifs.innerHTML !== doc.getElementById('gifs').innerHTML)
            gifs.innerHTML = doc.getElementById('gifs').innerHTML;
    }
    setInterval(updateClientList, 1000);
</script>
</body>
</html>
