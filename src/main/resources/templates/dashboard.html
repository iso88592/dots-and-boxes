<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dots and Boxes</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}"/>
</head>
<body>
<main class="container">
    <div class="row">
        <section class="col-12">
            <h1 class="text-center">Dots and Boxes</h1>
        </section>
        <section class="col-9" id="game-state">
            <h2>Game state</h2>
            <div id="gifs">
                <div >
                    <img th:each="gif : ${gifs}" th:src="@{'/gifs/' + ${gif}}" th:alt="${gif}">
                </div>
            </div>
        </section>
        <section class="col-3" id="participants">
            <h2>Participants</h2>
            Wanna join? Click <a id="join" class="" th:href="@{/join}">here</a>!
            <hr>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Names</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${clients.size() == 0}">
                        <td colspan="3" class="text-center">There are no participants yet.</td>
                    </tr>
                    <tr th:if="${clients.size() > 0}" th:each="client: ${clients}">
                        <td th:text="${client.getId() + ' ' + client.getPublicAddress()}"></td>
                        <td th:text="${client.getNames()}"></td>
                        <td th:text="${client.getScore()}"></td>
                    </tr>
                </tbody>
            </table>
            <hr>
            <img th:src="@{/img/pirate_unicorn_mlp.png}" alt="mlp pirate unicorn generated by Sora" class="img-fluid rounded"
                 data-llm-prompt="Create an image in MLP style of a pirate unicorn that is in the flow of programming something great">
            <hr>
            Please connect to this wireless network:
            <table class="table table-sm">
                <tr>
                    <td>SSID</td>
                    <td><strong>Linuksz</strong></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><strong>SzeresdAPingvint42!</strong></td>
                </tr>
            </table>
            Or scan the following QR code:
            <div style="margin:auto;">
                <img th:src="@{/img/wifi.png}" alt="wifi qr code" style="width:100%; border: 1px solid gray;" class="rounded">
            </div>
        </section>
    </div>
</main>
<script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.min.js}"></script>
<script>
    async function updateClientList() {
        const response = await fetch('/');
        const data = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(data, 'text/html');
        const participants = document.getElementById('participants');
        if (participants.innerHTML !== doc.getElementById('participants').innerHTML)
            participants.innerHTML = doc.getElementById('participants').innerHTML;
        const gifs = document.getElementById('gifs');
        if (gifs.innerHTML !== doc.getElementById('gifs').innerHTML)
            gifs.innerHTML = doc.getElementById('gifs').innerHTML;
    }
    setInterval(updateClientList, 1000);
</script>
</body>
</html>
